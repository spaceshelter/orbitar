version: '3.9'

services:
  caddy:
    image: caddy
    restart: unless-stopped
    # noinspection ComposeUnknownValues
    ports:
      # expose port 80 if TLS is disabled, 443 if enabled
      - "${TLS_ENABLED+443:443}${TLS_ENABLED-80:80}"

    # Common environment variables
    environment:
      # If TLS_ENABLED is set, use https in SERVER_HOST; otherwise http
      SERVER_HOST: "http${TLS_ENABLED+s}://${SERVER_DOMAIN}"
      API_HOST: "http${TLS_ENABLED+s}://${API_DOMAIN}"

      # Cert/Key paths: only set if TLS_ENABLED is non-empty *and* file is non-empty
      TLS_CERT_PATH: "${TLS_ENABLED+${TLS_CERT_FILE:+/certs/${TLS_CERT_FILE}}}"
      TLS_KEY_PATH: "${TLS_ENABLED+${TLS_KEY_FILE:+/certs/${TLS_KEY_FILE}}}"


      # tls_on if TLS_ENABLED is set and cert/key files are non-empty
      # tls_off if TLS_ENABLED is not set
      # tls_ if TLS_ENABLED is set but cert/key files are empty
      TLS_MODE: "tls_${TLS_ENABLED+${TLS_CERT_FILE:+on}}${TLS_ENABLED-off}"

      SERVER_DOMAIN: "${SERVER_DOMAIN}"
      API_DOMAIN: "${API_DOMAIN}"
      BACKEND_DOMAIN: "backend"
      MEDIA_HOSTING_URL: "${MEDIA_HOSTING_URL}"
      MEDIA_HOSTING_CLIENT_ID: "${MEDIA_HOSTING_CLIENT_ID}"
      FINGERPRINT: "${FINGERPRINT}"

    volumes:
      - $PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - $PWD/caddy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
      - frontend_build:/srv:ro

    depends_on:
      - backend
    # Default caddy command borrowed from https://github.com/caddyserver/caddy-docker/blob/master/Dockerfile.tmpl
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]


  mysql:
    platform: linux/amd64
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_db:/var/lib/mysql
      - $PWD/mysql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: redis-server --save 20 1 --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping | grep PONG
      interval: 5s
      timeout: 20s
      retries: 10

  frontend:
    build:
      context: frontend
      args:
        NODE_ENV: production
        SERVER_DOMAIN: ${SERVER_DOMAIN}
        MEDIA_HOSTING_URL: ${MEDIA_HOSTING_URL}
        API_DOMAIN: ${API_DOMAIN}
        VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
    restart: "no"
    volumes:
      - frontend_build:/frontend

  backend:
    build:
      context: backend
    restart: always
    environment:
      SITE_DOMAIN: ${SERVER_DOMAIN}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENDING_BLUE_API_KEY: ${SENDING_BLUE_API_KEY}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      MEDIA_HOSTING_URL: ${MEDIA_HOSTING_URL}
      MEDIA_HOSTING_DIMS_AES_KEY: ${MEDIA_HOSTING_DIMS_AES_KEY}
      BARMALINI_USER_ID: ${BARMALINI_USER_ID}
      BARMALINI_KEY: ${BARMALINI_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
    depends_on:
      - mysql
      - redis
      - feed
      - elasticsearch-setup

  feed:
    build:
      context: feed
    restart: always

  elasticsearch:
    image: elasticsearch:7.17.8
    restart: always
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: curl -s -f http://localhost:9200/_cluster/health?wait_for_status=green >/dev/null || exit 1
      interval: 10s
      timeout: 30s
      retries: 10
    volumes:
      - elasticsearch_data:/usr/share/elastic-setup/data
      - $PWD/search/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro

  # performs initial setup of elasticsearch and exits
  elasticsearch-setup:
    image: curlimages/curl
    restart: "no"
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - $PWD/search/setup.sh:/setup.sh:ro
    entrypoint: /bin/sh
    command: /setup.sh

  # performs periodic indexing of elasticsearch
  elasticsearch-indexer:
    build:
      context: search
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
      backend:
        condition: service_started # TODO change to service_healthy when we have a healthcheck

volumes:
  caddy_data:
  caddy_config:
  frontend_build:
  mysql_db:
  redis_data:
  elasticsearch_data:
