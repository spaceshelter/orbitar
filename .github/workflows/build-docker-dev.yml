name: Build Docker
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    paths:
      - .github/workflows/build-docker-dev.yml
      - compose.yml
      - compose-dev.yml
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    strategy:
        matrix:
            dc-file: [compose.yml, compose-dev.yml]
            extra-env: ["", "TLS_ENABLED=''"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker
        run: ${{ matrix.extra-env }} docker compose -f ${{ matrix.dc-file }} build --no-cache


  validate-docker-compose:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dc-file: [ compose.yml, compose-dev.yml ]
        extra-env: ["", "TLS_ENABLED=''"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: ${{ matrix.extra-env }} docker compose -f ${{ matrix.dc-file }} config --quiet
