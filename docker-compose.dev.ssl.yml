services:
  caddy:
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_HOST: https://${SERVER_DOMAIN}
      API_HOST: https://${API_DOMAIN}
    volumes:
      - $PWD/caddy/on-tls.Caddyfile:/etc/caddy/working.tls.Caddyfile:ro
      - $PWD/caddy/certs:/certs:ro

  mysql:
    ports:
      - "3306:3306"
      - "33060:33060"

  redis:
    ports:
      - "6379:6379"

  feed:
    ports:
      - "6767:6767"
