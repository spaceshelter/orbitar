printWidth: 120
semi: true
singleQuote: true
trailingComma: "all"
useTabs: false
tabWidth: 4
bracketSpacing: false
plugins:
  - "@ianvs/prettier-plugin-sort-imports"
importOrder:
  - ^(react|react-router-dom)$
  - ""
  - <THIRD_PARTY_MODULES>
  - ""
  - ^(?!.*[.](css|scss|svg)$)[./].*$
  - ""
  - .(css|scss|svg)$
